@let _item = item();
@let _quantity = quantity();

<div class="info">
  <div class="name">{{ _item.name }}</div>
  <div class="description">{{ _item.description }}</div>
</div>
<div class="price">
  @if (_item.openPrice) {
    <span class="tag">Open price</span>
  } @else {
    {{ _item.price | money }}
  }
</div>
<div class="action">
  @if (!_item.available) {
    <span class="sold-out">Sold out</span>
  } @else if (_item.openPrice) {
    <button type="button"
        [attr.aria-label]="'Add ' + _item.name"
        (click)="add.emit()"
        mat-stroked-button>
      {{ _quantity ? 'Add · ' + _quantity + ' in cart' : 'Add' }}
    </button>
  } @else if (_quantity > 0) {
    <app-quantity-stepper [value]="_quantity"
        [label]="_item.name"
        (valueChange)="quantityChange.emit($event)" />
  } @else {
    <button type="button"
        [attr.aria-label]="'Add ' + _item.name"
        (click)="add.emit()"
        mat-flat-button>
      Add
    </button>
  }
</div>
