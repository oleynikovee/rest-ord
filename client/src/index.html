<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trattoria — order online</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Order from our menu with live prices and availability.">
  <meta name="theme-color" content="#b3261e">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Only the glyphs the app uses (icon_names), so the icon font is a few KB. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add,close,delete,edit,remove,restaurant,search,shopping_cart,warning&display=block">
  <style>
    /* Painted before Angular boots: no blank screen and no layout jump. */
    body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .boot { display: flex; align-items: center; height: 64px; padding: 0 16px; background: #fbeeec; color: #b3261e; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #1d1b1b; } .boot { background: #2b2626; color: #ffb4ab; } }
  </style>
</head>
<body>
  <app-root><div class="boot">Trattoria</div></app-root>
  <noscript>Please enable JavaScript to order online.</noscript>
</body>
</html>
