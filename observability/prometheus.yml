global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Every API replica: the service name resolves to all of them.
  - job_name: trattoria-api
    dns_sd_configs:
      - names: ['app']
        type: A
        port: 9464
