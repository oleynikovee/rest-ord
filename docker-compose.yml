services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      POSTGRES_DB: restaurant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restaurant -d restaurant']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  app:
    build:
      context: .
      target: app
    deploy:
      replicas: 2
    environment:
      TRUST_PROXY: 1
      DATABASE_URL: postgres://restaurant:restaurant@postgres:5432/restaurant
      REDIS_URL: redis://redis:6379
      STATUS_STEP_SECONDS: 8
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@trattoria.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend, frontend]

  edge:
    build:
      context: .
      target: edge
    ports:
      - '8080:8080'
      - '8443:8443'
      - '8443:8443/udp'
    volumes:
      - caddy-data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks: [frontend]

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  pgdata: {}
  caddy-data: {}
